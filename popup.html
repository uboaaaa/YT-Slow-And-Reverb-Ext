<!DOCTYPE html>
<html>
  <head>
    <title>Slow and Reverb Controller</title>
    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <div class="main-container">
      <div class="header-container">
        <header>
          <img
            id="status-icon"
            src="icons/off.svg"
            alt="Status Icon"
            width="20"
            height="20"
          />
          <div class="status-text-container">
            <div id="status-text"></div>
          </div>
        </header>
      </div>


      <div class="slider-container" id="rate-slider-container">
        <label for="rate-slider">
          <h4>Speed</h4>
          <span id="rate-value">1.00</span>
        </label>
        <div class="slider-wrapper">
          <input
            id="rate-slider"
            type="range"
            min="0.5"
            max="2"
            step="0.05"
            value="1.00"
          />
          <button id="reset-rate">
            <img id="reset-icon" src="icons/reset.svg" alt="Reset rate" />
          </button>
        </div>
      </div>
      <div class="slider-container" id="reverb-slider-container">
        <label for="reverb-slider">
          <h4>Reverb</h4>
          <span id="reverb-value">0.00</span>
        </label>
        <div class="slider-wrapper">
          <input
            id="reverb-slider"
            type="range"
            min="0"
            max="1"
            step="0.05"
            value="0.00"
          />
          <button id="reset-reverb">
            <img id="reset-icon" src="icons/reset.svg" alt="Reset reverb" />
          </button>
        </div>
      </div>

      <div class="preset-container" id="preset-container">
        <button class="preset-btn" data-preset="slowrev" title="slow + reverb" aria-label="slow + reverb">&#8600;</button>
        <button class="preset-btn" data-preset="default" title="default" aria-label="default">&#8212;</button>
        <button class="preset-btn" data-preset="nightcore" title="nightcore" aria-label="nightcore">&#8599;</button>
      </div>

      <div class="button-container">
        <div class="toggle-container">
          <button id="toggle-button">
            <img id="toggle-icon" src="icons/toggle.svg" alt="Toggle icon" />
          </button>
        </div>
      </div>

      <div class="support-container">
        <a class="support-link" id="kofi-link" href="https://ko-fi.com/uboaa" target="_blank" rel="noopener" title="support on ko-fi" aria-label="support on ko-fi"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></a>
        <a class="support-link" id="bug-link" href="https://github.com/" target="_blank" rel="noopener" title="report a bug" aria-label="report a bug"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 2 1.88 1.88"/><path d="M14.12 3.88 16 2"/><path d="M9 7.13v-1a3.003 3.003 0 1 1 6 0v1"/><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6"/><path d="M12 20v-9"/><path d="M6.53 9C4.6 8.8 3 7.1 3 5"/><path d="M6 13H2"/><path d="M3 21c0-2.1 1.7-3.9 3.8-4"/><path d="M20.97 5c0 2.1-1.6 3.8-3.5 4"/><path d="M22 13h-4"/><path d="M17.2 17c2.1.1 3.8 1.9 3.8 4"/></svg></a>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
