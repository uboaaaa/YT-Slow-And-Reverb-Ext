<!DOCTYPE html>
<html>
  <head>
    <title>Lento</title>
    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <div class="main-container">
      <div class="header-container">
        <header>
          <svg id="status-logo" class="status-logo" viewBox="0 0 480 480" width="19" height="19" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="m480 240.5l-220.1 161.5v-323.1zm-480.5 0l60.5-44.5v88.9zm144.6-106.1v212.3l-53-38.9v-134.5zm76-55.8v323.9l-45-33v-257.9z"/></svg>
          <div class="status-text-container">
            <div id="status-text">Lento</div>
          </div>
        </header>
      </div>

      <div class="slider-container" id="rate-slider-container">
        <label for="rate-slider">
          <h4>Speed</h4>
          <span id="rate-value">1.00</span>
        </label>
        <div class="slider-wrapper">
          <input id="rate-slider" type="range" min="0.5" max="2" step="0.01" value="1.00" />
          <button id="reset-rate" class="reset-btn" title="Reset speed" aria-label="Reset speed">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
        </div>
      </div>

      <div class="slider-container" id="reverb-slider-container">
        <label for="reverb-slider">
          <h4>Reverb</h4>
          <span id="reverb-value">0.00</span>
        </label>
        <div class="slider-wrapper">
          <input id="reverb-slider" type="range" min="0" max="1" step="0.01" value="0.00" />
          <button id="reset-reverb" class="reset-btn" title="Reset reverb" aria-label="Reset reverb">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
        </div>
      </div>

      <div class="slider-container" id="bass-slider-container">
        <label for="bass-slider">
          <h4>Bass</h4>
          <span id="bass-value">0.00</span>
        </label>
        <div class="slider-wrapper">
          <input id="bass-slider" type="range" min="0" max="1" step="0.01" value="0.00" />
          <button id="reset-bass" class="reset-btn" title="Reset bass" aria-label="Reset bass">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
        </div>
      </div>

      <div class="preset-container" id="preset-container">
        <button class="preset-btn" data-preset="slowrev" title="slow + reverb" aria-label="slow + reverb">&#8600;</button>
        <button class="preset-btn is-active" data-preset="default" title="default" aria-label="default">&#8212;</button>
        <button class="preset-btn" data-preset="nightcore" title="nightcore" aria-label="nightcore">&#8599;</button>
      </div>

      <div class="button-container">
        <div class="toggle-container">
          <button id="toggle-button" title="Turn off" aria-label="Turn off">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg>
          </button>
        </div>
      </div>

      <div class="support-container">
        <a class="support-link" id="kofi-link" href="https://ko-fi.com/uboaa" target="_blank" rel="noopener" title="support on ko-fi" aria-label="support on ko-fi"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></a>
        <a class="support-link" id="bug-link" href="https://docs.google.com/forms/d/e/1FAIpQLSdu6xYz325YErwMl479eP5JsDjB35sFx-_ZHshfyhGAInxnpA/viewform?usp=publish-editor" target="_blank" rel="noopener" title="report a bug" aria-label="report a bug"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 2 1.88 1.88"/><path d="M14.12 3.88 16 2"/><path d="M9 7.13v-1a3.003 3.003 0 1 1 6 0v1"/><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6"/><path d="M12 20v-9"/><path d="M6.53 9C4.6 8.8 3 7.1 3 5"/><path d="M6 13H2"/><path d="M3 21c0-2.1 1.7-3.9 3.8-4"/><path d="M20.97 5c0 2.1-1.6 3.8-3.5 4"/><path d="M22 13h-4"/><path d="M17.2 17c2.1.1 3.8 1.9 3.8 4"/></svg></a>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
