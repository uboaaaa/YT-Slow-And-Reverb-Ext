name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - name: check out repo
              uses: actions/checkout@v4

            - name: set up Node
              uses: actions/setup-node@v4
              with:
                node-version: 24
            
            - name: syntax check on scripts
              run: |
                for f in background.js content.js popup.js page-hook.js; 
                do
                    node --check "$f"
                done
            
            - name: stage browser builds
              run: node tools/build.mjs

            - name: lint extension
              run: npx --yes web-ext lint --source-dir dist/firefox

            - name: build firefox zip
              run: npx --yes web-ext build --source-dir dist/firefox --artifacts-dir artifacts-firefox

            - name: build chrome zip
              run: |
                mkdir -p artifacts-chrome
                cd dist/chrome && zip -r ../../artifacts-chrome/lento-chrome.zip .

            - name: upload firefox zip
              uses: actions/upload-artifact@v4
              with:
                name: lento-firefox
                path: artifacts-firefox/*.zip

            - name: upload chrome zip
              uses: actions/upload-artifact@v4
              with:
                name: lento-chrome
                path: artifacts-chrome/lento-chrome.zip
